name: Release

# Publishes one stable release (decisions 0079, 0190): check -> build
# (build.yml) -> publish -> image (ghcr.io/flexdinesh/zero:X.Y.Z and latest,
# decision 0125). Run it from the Actions tab on main: it releases main's
# commit as the next patch of .release-version's major.minor series
# (tools/release-version), and publish creates the tag. Pushing a vX.Y.Z tag
# that points at a main commit releases that tag instead. Tags name plain main
# commits; nothing is committed. A published release is never rebuilt or
# replaced, so dispatching again with no new commit publishes nothing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      number: ${{ steps.tag.outputs.number }}
      commit: ${{ steps.tag.outputs.commit }}
      published: ${{ steps.tag.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache: false

      # A dispatch releases main's commit as the next patch of
      # .release-version's series, or as the tag already on that commit.
      - name: Select tag
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT" != workflow_dispatch ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF" != refs/heads/main ]]; then
            echo "Run the release workflow on main, not $REF" >&2
            exit 1
          fi
          echo "tag=$(go run ./tools/release-version)" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.select.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          number='(0|[1-9][0-9]*)'
          if [[ ! "$TAG" =~ ^v${number}\.${number}\.${number}$ ]]; then
            echo "$TAG is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          # Annotated tags resolve to the commit they name; a dispatch's new
          # tag does not exist yet and names the checked-out main commit.
          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          else
            commit="$(git rev-parse HEAD)"
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "$TAG points at $commit, which is not on main" >&2
            exit 1
          fi

          published=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its assets are never rebuilt."
            published=true
          fi

          {
            echo "tag=$TAG"
            echo "number=${TAG#v}"
            echo "commit=$commit"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
      version: ${{ needs.check.outputs.number }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      # Re-checked here, so re-running only this job after a partial failure
      # never replaces a release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT: ${{ needs.check.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi
          # Creates the tag at COMMIT when a dispatch selected a new one, only
          # after every asset built.
          gh release create "$TAG" release-dist/* \
            --target "$COMMIT" \
            --title "$TAG" \
            --generate-notes \
            --latest

  # Pushes the image build.yml made from this release's archives.
  image:
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: image

      - name: Push image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/flexdinesh/zero
          VERSION: ${{ needs.check.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          for tag in "$VERSION" latest; do
            skopeo copy --all oci-archive:image/zero.tar "docker://${IMAGE}:${tag}"
          done
